# Sitio estático + una función para la base de datos del panel.
[build]
  publish = "."
  functions = "netlify/functions"
  # sitio estático: no hay que compilar nada, solo instalar la dependencia
  # de la función (@netlify/blobs) y publicar los archivos tal cual
  command = "echo 'sin build'"

[functions]
  node_bundler = "esbuild"

# cache largo para las texturas de mapa (no cambian nunca)
[[headers]]
  for = "/media/maps/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
